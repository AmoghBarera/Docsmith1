name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run unit tests
      run: |
        pytest tests/test_utils.py tests/test_parser.py tests/test_cache.py

    - name: Run integration tests (with sudo)
      run: |
        # GitHub Actions runners allow passwordless sudo.
        # This allows us to test pivot_root, namespaces, and cgroups.
        sudo env PATH="$PATH" PYTHONPATH="$PYTHONPATH" pytest tests/test_integration.py tests/test_isolation.py
